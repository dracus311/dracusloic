<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Admin FacturoAfrik</title>
<style>body{font-family:sans-serif;padding:20px;max-width:500px;margin:auto}input,button{width:100%;padding:15px;margin:10px 0;border-radius:10px;border:1px solid #ccc}button{background:#0f7a3a;color:white;font-weight:bold;border:none} .card{background:#f0fdf4;padding:15px;border-radius:10px;margin:10px 0}</style>
</head>
<body>
<h2>🔐 Admin FacturoAfrik</h2>
<input id="tel" placeholder="Numéro client ex: 694697496">
<select id="plan"><option value="freelance">Freelance - 2500F</option><option value="business">Business - 5000F</option></select>
<button onclick="activer()">✅ ACTIVER PREMIUM</button>
<div id="liste"></div>
<script>
function activer(){
 let t=tel.value.trim(); if(!t) return alert("Mets le numéro");
 let premium=JSON.parse(localStorage.getItem("premium_clients")||"[]");
 premium=premium.filter(p=>p.tel!==t);
 premium.push({tel:t, plan:plan.value, jusqu: Date.now()+30*24*3600*1000, date: new Date().toLocaleDateString()});
 localStorage.setItem("premium_clients", JSON.stringify(premium));
 alert("Client "+t+" activé jusqu'à 1 mois !");
 afficher();
 tel.value="";
}
function afficher(){
 let premium=JSON.parse(localStorage.getItem("premium_clients")||"[]");
 liste.innerHTML="<h3>Clients Premium ("+premium.length+")</h3>" + premium.map(p=>`<div class=card><b>${p.tel}</b> - ${p.plan}<br>Expire: ${new Date(p.jusqu).toLocaleDateString()}<br><small>Activé le ${p.date}</small></div>`).join("");
}
afficher();
</script>
</body>
</html>
