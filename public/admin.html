<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin FacturoAfrik</title><link rel="icon" href="icon.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--blue:#0B5FFF;--orange:#FF6B00;--bg:#080A12;--card:#11152A;--border:#1E2642;--muted:#8B93B0}*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:var(--bg);color:#fff}#lock{position:fixed;inset:0;background:rgba(8,10,18,.97);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}.box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px;max-width:420px;width:100%;text-align:center}input{width:100%;padding:13px;background:#0E1224;border:1px solid var(--border);border-radius:10px;color:#fff;margin:8px 0}.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:800;cursor:pointer;margin-top:8px}.btn-blue{background:var(--blue);color:#fff}.btn-orange{background:var(--orange);color:#fff}.main{display:flex;min-height:100vh}.side{width:220px;background:var(--card);border-right:1px solid var(--border);padding:20px}.side a{display:block;padding:10px;color:var(--muted);text-decoration:none;border-radius:10px;margin-bottom:6px}.side a.active,.side a:hover{background:var(--blue);color:#fff}.content{flex:1;padding:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}table{width:100%;border-collapse:collapse}th{color:var(--muted);font-size:12px;text-align:left;padding:10px;border-bottom:1px solid var(--border)}td{padding:12px 10px;border-bottom:1px solid var(--border);font-size:14px}</style></head><body>
<div id="lock"><div class="box"><img src="icon.png" style="width:60px;border-radius:12px"><h2 style="margin:12px 0">Abonnement requis 🔒</h2><p style="color:var(--muted);font-size:14px">Freelance <b>2500 FCFA/mois</b> (2 mois=5000)<br>Entreprise <b>5000 FCFA/mois</b><br>Paye au <b style="color:var(--orange)">690186311</b> Orange Money</p><input id="telCheck" placeholder="Ton WhatsApp 6XXXXXXXX"><button class="btn btn-blue" onclick="verif()">Vérifier mon abo</button><button class="btn btn-orange" onclick="location.href='payer.html'">Payer maintenant</button><p id="lockMsg" style="margin-top:12px;font-size:13px;color:var(--orange)"></p></div></div>
<div class="main"><div class="side"><h2 style="color:var(--blue);margin-bottom:20px">FacturoAfrik</h2><a class="active" onclick="show('dash')">📊 Dashboard</a><a onclick="show('fact')">🧾 Factures</a><a onclick="show('clients')">👥 Clients</a><a onclick="show('new')">➕ Nouvelle</a><a onclick="localStorage.clear();location.reload()" style="color:var(--orange);margin-top:20px">🚪 Déconnexion</a></div><div class="content"><div style="display:flex;justify-content:space-between"><h1 id="title">Dashboard</h1><span id="badge" style="background:#00D88C;padding:6px 12px;border-radius:20px;font-size:12px"></span></div><div id="dash"><div class="grid"><div class="card"><h3 id="k1">0 FCFA</h3><p style="color:var(--muted)">CA</p></div><div class="card"><h3 id="k2">0</h3><p>Clients</p></div><div class="card"><h3 id="k3">0</h3><p>Factures</p></div></div><div class="card"><table id="recent"></table></div></div><div id="fact" style="display:none"><div class="card"><table id="tblFact"></table></div></div><div id="clients" style="display:none"><div class="card"><h3>Ajouter client</h3><input id="cNom" placeholder="Nom"><input id="cTel" placeholder="Tel"><button class="btn btn-blue" onclick="addClient()">Ajouter</button></div><div class="card"><table id="tblCli"></table></div></div><div id="new" style="display:none"><div class="card"><h3>Nouvelle facture</h3><select id="fCli"></select><input id="fObj" placeholder="Objet ex: Site web"><input id="fMont" type="number" placeholder="Montant FCFA"><select id="fStat"><option>Payée</option><option>En attente</option></select><button class="btn btn-blue" onclick="addFact()">Créer</button></div></div></div></div>
<script>
const SUPA_URL=""; const SUPA_KEY=""; // <-- METS TES CLES ICI PLUS TARD
async function verif(){
 let tel=(telCheck.value||localStorage.getItem('fa_tel')||'').trim(); if(!tel){lockMsg.innerText='Entre ton numéro';return} lockMsg.innerText='Vérification...';
 let clean=tel.replace(/\D/g,'').slice(-9);
 if(SUPA_URL){try{let s=supabase.createClient(SUPA_URL,SUPA_KEY);let {data}=await s.from('subscriptions').select('*').ilike('telephone','%'+clean+'%').eq('statut','actif').gte('fin',new Date().toISOString()); if(data&&data.length>0){ok(tel,data[0].plan+' - '+data[0].mois+' mois');return}}catch(e){}}
 try{let r=await fetch('./codes.json?t='+Date.now());let j=await r.json();if(j.actifs.some(n=>n.replace(/\D/g,'').slice(-9)==clean)){ok(tel,'Actif');return}}catch(e){}
 lockMsg.innerText='❌ Non trouvé. Si tu as payé au 690186311, attends que Loïc t\'active (max 15min). Contact WhatsApp: 690186311';
}
function ok(tel,label){localStorage.setItem('fa_tel',tel);localStorage.setItem('fa_auth','ok');document.getElementById('lock').style.display='none';document.getElementById('badge').innerText=label+' | '+tel;}
window.onload=()=>{let t=localStorage.getItem('fa_tel');if(t){telCheck.value=t;if(localStorage.getItem('fa_auth'))verif()}}
let clients=JSON.parse(localStorage.getItem('fa_clients')||'[]');let facts=JSON.parse(localStorage.getItem('fa_fact')||'[]');function save(){localStorage.setItem('fa_clients',JSON.stringify(clients));localStorage.setItem('fa_fact',JSON.stringify(facts));render()}function show(id){['dash','fact','clients','new'].forEach(x=>document.getElementById(x).style.display=x==id?'block':'none')}function addClient(){if(!cNom.value)return;clients.push({nom:cNom.value,tel:cTel.value});cNom.value=cTel.value='';save()}function addFact(){if(!fObj.value||!fMont.value)return;facts.unshift({id:'FA-'+Date.now().toString().slice(-4),client:fCli.value,objet:fObj.value,montant:+fMont.value,statut:fStat.value});save();show('fact')}function render(){k3.innerText=facts.length;k2.innerText=clients.length;k1.innerText=facts.reduce((s,f)=>s+f.montant,0).toLocaleString()+' FCFA';fCli.innerHTML=clients.map(c=>`<option>${c.nom}</option>`).join('')||'<option>Client Test</option>';let h='<tr><th>N°</th><th>Client</th><th>Montant</th></tr>';let rows=facts.map(f=>`<tr><td>${f.id}</td><td>${f.client}<br><small style=color:#8B93B0>${f.objet}</small></td><td>${f.montant.toLocaleString()} FCFA</td></tr>`).join('');tblFact.innerHTML=h+rows;recent.innerHTML=h+rows;tblCli.innerHTML='<tr><th>Nom</th><th>Tel</th></tr>'+clients.map(c=>`<tr><td>${c.nom}</td><td>${c.tel}</td></tr>`).join('')}render();
</script></body></html>
