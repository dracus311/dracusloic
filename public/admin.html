<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FacturoAfrik - Admin</title>
<link rel="icon" href="icon.png">
<style>
:root{--blue:#0B5FFF;--bg:#080A12;--card:#11152A;--border:#1E2642;--text:#fff;--muted:#8B93B0}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:var(--bg);color:var(--text);display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--card);border-right:1px solid var(--border);padding:20px}
.sidebar h2{color:var(--blue);margin-bottom:25px;display:flex;align-items:center;gap:10px}
.sidebar a{display:block;padding:10px 12px;color:var(--muted);text-decoration:none;border-radius:10px;margin-bottom:6px}
.sidebar a.active,.sidebar a:hover{background:var(--blue);color:#fff}
.main{flex:1;padding:20px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kpi h3{font-size:28px;color:var(--blue)}
.kpi p{color:var(--muted);font-size:13px}
input,select{width:100%;padding:12px;background:#0E1224;border:1px solid var(--border);border-radius:10px;color:#fff;margin-bottom:10px}
.btn{background:var(--blue);color:#fff;border:none;padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
table{width:100%;border-collapse:collapse}
th{color:var(--muted);font-size:12px;text-align:left;padding:10px;border-bottom:1px solid var(--border)}
td{padding:12px 10px;border-bottom:1px solid var(--border);font-size:14px}
@media(max-width:700px){body{flex-direction:column}.sidebar{width:100%}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="sidebar">
<h2><img src="icon.png" style="width:28px;border-radius:6px"> FacturoAfrik</h2>
<a href="#" class="active" onclick="show('dash')">📊 Dashboard</a>
<a href="#" onclick="show('factures')">🧾 Factures</a>
<a href="#" onclick="show('clients')">👥 Clients</a>
<a href="#" onclick="show('new')">➕ Nouvelle Facture</a>
<a href="./index.html">🚪 Accueil</a>
</div>
<div class="main">
<div class="top"><h1 id="title">Dashboard</h1><button class="btn" onclick="show('new')">+ Facture</button></div>

<div id="dash">
<div class="grid">
<div class="card kpi"><h3 id="k1">0 FCFA</h3><p>Chiffre du mois</p></div>
<div class="card kpi"><h3 id="k2">0</h3><p>Factures</p></div>
<div class="card kpi"><h3 id="k3">0</h3><p>Clients</p></div>
</div>
<div class="card"><h3>Factures récentes</h3><table id="recent"></table></div>
</div>

<div id="factures" style="display:none"><div class="card"><table id="tblFact"></table></div></div>

<div id="clients" style="display:none">
<div class="card">
<h3>Ajouter client</h3>
<input id="cNom" placeholder="Nom / Entreprise">
<input id="cTel" placeholder="Téléphone / WhatsApp">
<input id="cMail" placeholder="Email">
<button class="btn" onclick="addClient()">Enregistrer client</button>
</div>
<div class="card"><table id="tblClient"></table></div>
</div>

<div id="new" style="display:none">
<div class="card">
<h3>Nouvelle facture</h3>
<select id="fClient"></select>
<input id="fObjet" placeholder="Objet: ex: Prestation site web">
<input id="fMontant" type="number" placeholder="Montant FCFA">
<select id="fStatut"><option>Payée</option><option>En attente</option><option>En retard</option></select>
<button class="btn" onclick="addFacture()">Créer facture</button>
</div>
</div>

</div>
<script>
let clients=JSON.parse(localStorage.getItem('fa_clients')||'[]');
let factures=JSON.parse(localStorage.getItem('fa_fact')||'[]');
function save(){localStorage.setItem('fa_clients',JSON.stringify(clients));localStorage.setItem('fa_fact',JSON.stringify(factures));render();}
function show(id){['dash','factures','clients','new'].forEach(x=>document.getElementById(x).style.display=x==id?'block':'none');document.getElementById('title').innerText=id=='dash'?'Dashboard':id=='factures'?'Factures':id=='clients'?'Clients':'Nouvelle Facture';document.querySelectorAll('.sidebar a').forEach(a=>a.classList.remove('active'))}
function addClient(){if(!cNom.value)return;clients.push({id:Date.now(),nom:cNom.value,tel:cTel.value,mail:cMail.value});cNom.value=cTel.value=cMail.value='';save();}
function addFacture(){if(!fObjet.value||!fMontant.value)return;factures.unshift({id:'FA-'+Date.now().toString().slice(-5),client:fClient.value||'Client',objet:fObjet.value,montant:parseInt(fMontant.value),statut:fStatut.value,date:new Date().toLocaleDateString()});fObjet.value=fMontant.value='';save();show('factures');}
function render(){
 k2.innerText=factures.length;k3.innerText=clients.length;k1.innerText=factures.reduce((s,f)=>s+f.montant,0).toLocaleString()+' FCFA';
 fClient.innerHTML=clients.map(c=>`<option>${c.nom}</option>`).join('')||'<option>Client Test</option>';
 let h='<tr><th>N°</th><th>Client</th><th>Montant</th><th>Statut</th></tr>';
 let rows=factures.map(f=>`<tr><td>${f.id}</td><td>${f.client}<br><small style=color:#8B93B0>${f.objet}</small></td><td>${f.montant.toLocaleString()} FCFA</td><td>${f.statut}</td></tr>`).join('');
 document.getElementById('tblFact').innerHTML=h+rows;document.getElementById('recent').innerHTML=h+rows.slice(0,300);
 document.getElementById('tblClient').innerHTML='<tr><th>Nom</th><th>Contact</th></tr>'+clients.map(c=>`<tr><td>${c.nom}</td><td>${c.tel} ${c.mail}</td></tr>`).join('');
}render();
</script>
</body>
</html>
