<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#0f172a;color:white;font-family:Arial;padding:20px} .card{background:#1e293b;padding:20px;border-radius:15px;margin:15px 0;border-left:5px solid #ef4444} .btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:bold;margin-top:10px;cursor:pointer} .btn-wa{background:#25D366;color:white} .btn-ok{background:#22c55e;color:white}</style></head><body><h1>🔔 ADMIN - Demandes</h1><div id="list">Chargement...</div><audio id="ding" src="https://assets.mixkit.co/sfx/preview/mixkit-alarm-digital-clock-beep-989.mp3" preload="auto"></audio><script>
const supa=supabase.createClient("https://mzjogfulbtcybsjwnvhr.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16am9nZnVsYnRjeWJzandudmhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MTg5OTksImV4cCI6MjEwNjI5NDk5OX0.wg_dNnggr7WLKnj1P1kd9jxPvWdX9vpsKsv1gh5dcJ8");
const listDiv=document.getElementById('list');const audio=document.getElementById('ding');
async function load(){const{data}=await supa.from('demandes').select('*').eq('statut','en_attente').order('created_at',{ascending:false});listDiv.innerHTML='';if(!data||!data.length){listDiv.innerHTML='✅ Aucune demande';return;}data.forEach(d=>add(d,false));}
function add(d,isNew){const div=document.createElement('div');div.className='card';div.innerHTML=`<b>📞 ${d.tel}</b><br>${d.plan} - ${d.mois} mois - <b>${d.total} FCFA</b><br><small>${new Date(d.created_at).toLocaleString()}</small><br><br><button class="btn btn-wa" onclick="window.open('https://wa.me/237${d.tel.replace(/\D/g,'').slice(-9)}')">📱 WhatsApp Client</button><button class="btn btn-ok" onclick="valider(${d.id})">✅ Marquer PAYÉ</button>`;listDiv.prepend(div);if(isNew){audio.play().catch(()=>{});if(navigator.vibrate)navigator.vibrate([500,200,500]);}}
window.valider=async(id)=>{await supa.from('demandes').update({statut:'paye'}).eq('id',id);load();};
supa.channel('demandes').on('postgres_changes',{event:'INSERT',schema:'public',table:'demandes'},p=>add(p.new,true)).subscribe();
load();
</script></body></html>
