<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dracus Loic IPTV</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif;background:#050508;color:#fff;min-height:100vh}
.hidden{display:none!important}
#client-view header{padding:20px;text-align:center;border-bottom:1px solid #1a1a23} #client-view h1{font-family:'Space Grotesk';font-size:28px} #client-view .hero{padding:40px 20px;text-align:center}
#client-view .cards{display:grid;gap:20px;max-width:400px;margin:20px auto;padding:0 20px} #client-view .card{border-radius:24px;padding:25px;border:1px solid #222;position:relative}
#client-view .freelance{background:linear-gradient(135deg,#3b82f6,#1d4ed8)} #client-view .entreprise{background:linear-gradient(135deg,#f59e0b,#d97706)}
#client-view .price{font-size:36px;font-weight:800} #client-view .btn{width:100%;padding:15px;border:none;border-radius:12px;font-weight:800;margin-top:15px;cursor:pointer;background:#fff;color:#000}
#client-view .modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:99;padding:20px} #client-view .box{background:#111118;border-radius:20px;padding:25px;width:100%;max-width:380px;border:1px solid #222} #client-view input,select{width:100%;padding:14px;border-radius:10px;border:1px solid #222;background:#000;color:#fff;margin:8px 0} #client-view .btn-pay{background:#22c55e;color:#fff}
#admin-view{background:#0f172a;min-height:100vh;padding:20px;font-family:Arial} #admin-view .acard{background:#1e293b;padding:20px;border-radius:15px;margin:15px 0;border-left:5px solid #ef4444} #admin-view .abtn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:bold;margin-top:10px;cursor:pointer} .abtn-wa{background:#25D366;color:#fff} .abtn-ok{background:#22c55e;color:#fff}
</style></head><body>

<div id="client-view">
<header><h1>DRACUS LOIC IPTV</h1></header>
<div class="hero"><h2 style="font-family:'Space Grotesk';font-size:42px">Premium IPTV</h2><p style="color:#888">Freelance 2500 / Entreprise 5000</p></div>
<div class="cards">
<div class="card freelance"><h3>💼 FREELANCE</h3><div class="price">2500 <small style="font-size:16px">FCFA / mois</small></div><p>1 Écran - Idéal perso</p><div style="display:flex;gap:10px;margin-top:10px"><select id="m1"><option value="1">1 mois</option><option value="3">3 mois</option><option value="6">6 mois</option><option value="12">12 mois</option></select><button class="btn" onclick="openPay('Freelance',2500,'m1')">Choisir</button></div></div>
<div class="card entreprise"><h3>🏢 ENTREPRISE</h3><div class="price">5000 <small style="font-size:16px">FCFA / mois</small></div><p>3 Écrans - 4K - Famille</p><div style="display:flex;gap:10px;margin-top:10px"><select id="m2"><option value="1">1 mois</option><option value="3">3 mois</option><option value="6">6 mois</option><option value="12">12 mois</option></select><button class="btn" onclick="openPay('Entreprise',5000,'m2')">Choisir</button></div></div>
</div>
<div id="payModal" class="modal hidden"><div class="box"><h3 id="payTitle"></h3><p>1- Payez Orange Money au <b>653244734</b></p><p>2- Entrez votre numéro :</p><input id="tel" placeholder="6XX XX XX XX"><p id="totalTxt" style="color:#22c55e;font-weight:bold;margin-top:10px"></p><button class="btn btn-pay" onclick="envoyer()">J'AI DÉJÀ PAYÉ ✅</button><button class="btn" style="background:#222;color:#fff" onclick="closePay()">Annuler</button></div></div>
</div>

<div id="admin-view" class="hidden"><h1>🔔 ADMIN - Demandes</h1><div id="list">Chargement...</div><audio id="ding" src="https://assets.mixkit.co/sfx/preview/mixkit-alarm-digital-clock-beep-989.mp3"></audio></div>

<script>
const supa=supabase.createClient("https://mzjogfulbtcybsjwnvhr.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16am9nZnVsYnRjeWJzandudmhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MTg5OTksImV4cCI6MjEwNjI5NDk5OX0.wg_dNnggr7WLKnj1P1kd9jxPvWdX9vpsKsv1gh5dcJ8");
let curPlan,curPrice,curMois,curTotal;
const isAdmin=window.location.pathname.includes('admin');
if(isAdmin){document.getElementById('client-view').classList.add('hidden');document.getElementById('admin-view').classList.remove('hidden');initAdmin();}

function openPay(plan,price,selId){curPlan=plan;curPrice=price;curMois=parseInt(document.getElementById(selId).value);curTotal=curPrice*curMois;document.getElementById('payTitle').innerText=plan+' - '+curMois+' mois';document.getElementById('totalTxt').innerText='Total à payer: '+curTotal+' FCFA au 653244734';document.getElementById('payModal').classList.remove('hidden');}
function closePay(){document.getElementById('payModal').classList.add('hidden');}
async function envoyer(){const tel=document.getElementById('tel').value;if(tel.length<9)return alert('Numéro invalide');const {error}=await supa.from('demandes').insert([{tel:tel,plan:curPlan,mois:curMois,total:curTotal,statut:'en_attente'}]);if(error)return alert(error.message);alert('✅ Reçu ! On vérifie et on t\'active.');closePay();}

function initAdmin(){
const list=document.getElementById('list'),audio=document.getElementById('ding');
async function load(){const{data}=await supa.from('demandes').select('*').eq('statut','en_attente').order('created_at',{ascending:false});list.innerHTML=data?.length?'': '✅ Aucune';data?.forEach(d=>add(d,false));}
function add(d,isNew){const el=document.createElement('div');el.className='acard';el.innerHTML=`<b>📞 ${d.tel}</b><br>${d.plan} - ${d.mois}m - <b>${d.total} FCFA</b><br><small>${new Date(d.created_at).toLocaleString()}</small><br><button class="abtn abtn-wa" onclick="window.open('https://wa.me/237${d.tel.replace(/\D/g,'').slice(-9)}')">📱 WhatsApp</button><button class="abtn abtn-ok" onclick="valider(${d.id})">✅ Marquer PAYÉ</button>`;list.prepend(el);if(isNew){audio.play().catch(()=>{});if(navigator.vibrate)navigator.vibrate([500,200,500]);}}
window.valider=async id=>{await supa.from('demandes').update({statut:'paye'}).eq('id',id);load();};
supa.channel('d').on('postgres_changes',{event:'INSERT',schema:'public',table:'demandes'},p=>add(p.new,true)).subscribe();load();
}
</script></body></html>
