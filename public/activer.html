<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Activer</title></head>
<body style="font-family:sans-serif;padding:20px;max-width:400px;margin:auto;text-align:center">
<h2>Activer votre abonnement</h2>
<input id="tel" placeholder="Votre numéro" style="width:100%;padding:15px;margin:10px 0">
<input id="code" placeholder="Votre code FACT-..." style="width:100%;padding:15px;margin:10px 0">
<button onclick="activer()" style="width:100%;padding:15px;background:green;color:white;border:none;border-radius:10px">ACTIVER</button>
<p id="msg"></p>
<script>
function activer(){
 let t=tel.value.trim(); let c=code.value.trim().toUpperCase();
 if(!c.includes("FACT-")){msg.innerText="Code invalide";return;}
 localStorage.setItem("userTel", t);
 localStorage.setItem("isPremium", "true");
 localStorage.setItem("premiumUntil", Date.now()+2592000000); // 30 jours
 msg.innerText="✅ Activé ! Redirection...";
 setTimeout(()=>location.href="index.html",1500);
}
</script>
</body></html>
