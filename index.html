<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - FacturoAfrik</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#0f172a;color:white;padding:20px}
h1{color:#38bdf8}
.card{background:#1e293b;padding:15px;border-radius:12px;margin:15px 0;border-left:5px solid #ef4444}
.btn{padding:10px 15px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:5px}
.btn-ok{background:#22c55e;color:white}
.btn-wa{background:#25D366;color:white}
.new{animation:blink 0.5s 3}
@keyframes blink{50%{background:#ef4444}}
</style>
</head>
<body>
<h1>🔔 Demandes en attente</h1>
<div id="list">Chargement...</div>
<audio id="ding" src="https://assets.mixkit.co/sfx/preview/mixkit-alarm-digital-clock-beep-989.mp3" preload="auto"></audio>
<script>
const SUPABASE_URL = "https://mzjogfulbtcybsjwnvhr.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16am9nZnVsYnRjeWJzandudmhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MTg5OTksImV4cCI6MjEwNjI5NDk5OX0.wg_dNnggr7WLKnj1P1kd9jxPvWdX9vpsKsv1gh5dcJ8";
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const listDiv = document.getElementById('list');
const audio = document.getElementById('ding');
async function loadDemandes(){
  const {data, error} = await supa.from('demandes').select('*').eq('statut','en_attente').order('created_at',{ascending:false});
  if(error){ listDiv.innerHTML="Erreur: "+error.message; return; }
  listDiv.innerHTML = "";
  if(!data || data.length==0){ listDiv.innerHTML="✅ Aucune demande en attente"; return; }
  data.forEach(d=> addCard(d, false));
}
function addCard(d, isNew){
  const div = document.createElement('div');
  div.className = 'card' + (isNew?' new':'');
  div.innerHTML = `<b>📞 ${d.tel}</b><br>Plan: ${d.plan} - ${d.mois} mois<br>Total: <b>${d.total} FCFA</b><br><small>${new Date(d.created_at).toLocaleString()}</small><br><br><button class="btn btn-wa" onclick="whatsapp('${d.tel}')">WhatsApp</button><button class="btn btn-ok" onclick="valider(${d.id},'${d.tel}')">✅ Marquer Payé</button>`;
  listDiv.prepend(div);
  if(isNew){ audio.play().catch(()=>{}); if(navigator.vibrate) navigator.vibrate([500,200,500]); }
}
async function valider(id, tel){ await supa.from('demandes').update({statut:'paye'}).eq('id',id); alert('Client '+tel+' validé !'); loadDemandes(); }
function whatsapp(tel){ window.open('https://wa.me/237'+tel.replace(/\D/g,'').slice(-9),'_blank'); }
supa.channel('demandes').on('postgres_changes',{event:'INSERT',schema:'public',table:'demandes'}, payload=>{ addCard(payload.new, true); }).subscribe();
loadDemandes();
</script>
</body>
</html>
