<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FacturoAfrik</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>#facturePreview{filter:blur(15px);transition:0.3s}#facturePreview.unlocked{filter:blur(0)}</style>
</head>
<body class="bg-gray-50 p-3">
<div class="max-w-lg mx-auto">

<h1 class="font-black text-2xl text-center">FacturoAfrik 🇨🇲</h1>
<p class="text-center text-xs">Factures illimitées pendant ta période payée</p>

<!-- PLANS -->
<div class="flex gap-2 mt-4">
<button onclick="setPlan(2500,'FREELANCE')" id="btnFree" class="flex-1 py-3 rounded-xl border-2 border-emerald-600 bg-emerald-50 font-black text-sm">FREELANCE<br>2500F/mois</button>
<button onclick="setPlan(5000,'PRO')" id="btnPro" class="flex-1 py-3 rounded-xl border-2 bg-white font-black text-sm">PRO<br>5000F/mois</button>
</div>

<p class="mt-3 font-bold text-sm">Plan: <span id="planLabel" class="text-emerald-700">FREELANCE 2500F</span></p>

<!-- SOLDE ACTIF -->
<div id="soldeBox" class="hidden bg-emerald-600 text-white p-3 rounded-xl mt-3 font-bold text-sm">
<p>✅ <span id="soldePlan"></span> - <span id="soldeMois">0</span> mois actifs</p>
<p class="text-xs">ILLIMITÉ jusqu'au <span id="soldeDate"></span></p>
<p class="text-[10px]">Tel: <span id="soldeTel"></span> | Total payé: <span id="soldeTotal"></span>F</p>
</div
